name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `engines` declares >=20, as the Zora Coins SDK does; Node 20.0 also
        # has the File global. Node 20.0 lacks AbortSignal.any, so it runs the
        # fallback. The floor and every major version from there are tested.
        node: ["20.0", "20", "22", "24"]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # viem and the Zora SDK are devDependencies: the tests sign real items
      # with a throwaway key. Neither reaches an installed package.
      - run: npm ci --no-audit --no-fund
      - run: npm test

  types:
    runs-on: ubuntu-latest
    name: types, and the README samples compile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      # The uploader is assignable to the SDK's own `Uploader`, viem accounts
      # and wallet clients are signers, and the quickstart compiles as written.
      - run: npm run types

  examples:
    runs-on: ubuntu-latest
    name: the examples run against testnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      # Throwaway keys, generated here and never stored. node-eoa.mjs uploads
      # through the free signed path on testnet and stops before sending a
      # transaction. smart-wallet-x402.mjs stops before paying. This job never
      # passes --send, --pay or --production.
      - name: run every example
        run: |
          key() { node -e "process.stdout.write(require('viem/accounts').generatePrivateKey())"; }
          PRIVATE_KEY=$(key) node examples/node-eoa.mjs
          OWNER_KEY=$(key) node examples/smart-wallet-x402.mjs

  live-script-guards:
    runs-on: ubuntu-latest
    name: the live scripts refuse production and chain 8453
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      # Offline. The live runs need a funded Base Sepolia key and stay manual,
      # per release: a key in a workflow input lands in a public run's payload.
      - run: node scripts/live-testnet.js --check-guards
      - name: the production script refuses to run without its flag
        run: |
          set +e
          node scripts/live-mainnet-free.js; code=$?
          [ "$code" = "2" ] || { echo "::error::expected exit 2, got $code"; exit 1; }

  house-style:
    runs-on: ubuntu-latest
    name: house style
    steps:
      - uses: actions/checkout@v4
      # Em dashes are banned in everything we write.
      - name: no em dashes
        run: |
          hits=$(git ls-files -z ':!package-lock.json' | xargs -0 grep -nP '\x{2014}' 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Em dashes are banned. Use a comma, a colon, or parentheses."
            exit 1
          fi
          echo "no em dashes"
      # The read-back greps from the house technical-writing style, on the
      # prose an integrator reads.
      - name: no filler, time words or vague links
        run: |
          files="README.md SKILL.md AGENTS.md index.d.ts examples/*.mjs"
          hits=$(grep -nEi \
            -e '\b(simply|easily|obviously|of course|note that|just|should)\b' \
            -e '\b(currently|at present|for now|the latest|newer|soon|eventually|as of this writing)\b' \
            -e '\b(e\.g\.|i\.e\.|etc\.|and/or|please)\b' \
            -e '\b(whitelist|blacklist|sanity.check|dummy|guarantees|ensures|fastest|best.in.class)\b' \
            -e '\[(here|this|this document|this doc|link|read more|more)\]' \
            $files || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::See the house technical-writing style."
            exit 1
          fi
          echo "clean"

  one-dependency:
    runs-on: ubuntu-latest
    name: exactly one runtime dependency
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # @ardrive/turbo-upload and nothing else. It has no dependencies itself,
      # so installing this package adds two lockfile entries, never more.
      - name: assert the declared dependencies
        run: |
          deps=$(node -p "JSON.stringify(Object.keys(require('./package.json').dependencies || {}))")
          other=$(node -p "JSON.stringify({ ...require('./package.json').peerDependencies, ...require('./package.json').optionalDependencies })")
          echo "dependencies: $deps"
          echo "peer and optional: $other"
          if [ "$deps" != '["@ardrive/turbo-upload"]' ] || [ "$other" != "{}" ]; then
            echo "::error::The one runtime dependency is @ardrive/turbo-upload. See README."
            exit 1
          fi
      - name: assert the published tarball adds exactly two lockfile entries
        run: |
          npm pack --silent
          tgz=$(ls -t ./*.tgz | head -1)
          dir=$(mktemp -d)
          cd "$dir" && npm init -y >/dev/null
          npm install --package-lock-only --silent "$OLDPWD/$tgz"
          n=$(node -p "Object.keys(require('$dir/package-lock.json').packages).filter(Boolean).length")
          echo "lockfile entries added: $n"
          [ "$n" = "2" ] || { echo "::error::Expected 2 lockfile entries, got $n"; exit 1; }
