name: publish

# Tag-driven, so publishing is a deliberate act with a reviewable trigger
# rather than a side effect of merging. After the version bump has merged to
# main, push a tag that matches the version in package.json:
#
#   git tag v0.1.1 && git push origin v0.1.1
#
# THE FIRST VERSION IS PUBLISHED BY HAND. npm can only attach a trusted
# publisher to a package that already exists, so for 0.1.0:
#   1. A maintainer runs `npm publish` once, from a clean checkout of the
#      release commit on main.
#   2. On npmjs.com, the package page -> Settings -> Trusted Publisher ->
#      GitHub Actions:
#        organization: ardriveapp   repository: turbo-zora-uploader   workflow: publish.yml
#   3. The maintainer tags v0.1.0 on that same commit and pushes the tag. This
#      workflow finds 0.1.0 already on the registry and stops with a notice.
# From 0.1.1 on, every tag publishes through this workflow.
#
# AUTHENTICATION: npm trusted publishing, so there is no token and no
# repository secret. npm verifies a short-lived OIDC token that GitHub mints for
# this workflow in this repository, which is why `id-token: write` below is
# required.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for the OIDC exchange and for npm provenance, which attests
      # that this tarball was built from this commit by this workflow.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the tag's commit can be checked against main.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1. Node 24
          # satisfies the first; npm is upgraded below for the second.
          node-version: "24"
          # Writes the .npmrc that points npm at the registry. Without it npm
          # fails ENEEDAUTH without attempting the OIDC exchange. Do not set
          # NODE_AUTH_TOKEN on the publish step: a token is used before OIDC.
          registry-url: "https://registry.npmjs.org"

      - name: npm new enough for trusted publishing
        run: |
          npm install -g npm@^11
          npm --version

      # A tag on a branch nobody reviewed would publish unreviewed code.
      - name: the tag's commit must be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main."
            exit 1
          }

      # A tag that disagrees with package.json publishes a version nobody
      # intended and cannot be taken back, so it fails here instead.
      - name: the tag must match the version in package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          echo "tag=$tag  package.json=$pkg"
          [ "$tag" = "$pkg" ] || {
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          }

      # Already on the registry: the first version, published by hand, or a
      # re-pushed tag. Nothing to do, so the run succeeds and says why.
      - name: skip a version that is already published
        id: published
        run: |
          name=$(node -p "require('./package.json').name")
          pkg=$(node -p "require('./package.json').version")
          if npm view "$name@$pkg" version >/dev/null 2>&1; then
            echo "::notice::$name@$pkg is already on the registry. Nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.published.outputs.skip != 'true'
        run: npm ci --no-audit --no-fund
      - if: steps.published.outputs.skip != 'true'
        run: npm test
      - if: steps.published.outputs.skip != 'true'
        run: npm run types

      # Reports, never blocks. When a publish fails, read this first.
      - name: what npm will try to authenticate with
        if: steps.published.outputs.skip != 'true'
        run: |
          echo "npm      $(npm --version)"
          echo "node     $(node --version)"
          echo "registry $(npm config get registry)"
          echo "OIDC available: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}${ACTIONS_ID_TOKEN_REQUEST_URL:-NO, id-token write is missing}"
          token=$(npm config get //registry.npmjs.org/:_authToken 2>/dev/null || true)
          case "$token" in
            ""|undefined) echo "auth token: none, so OIDC is the only path" ;;
            *NODE_AUTH_TOKEN*) echo "auth token: an unexpanded placeholder, which npm may prefer over OIDC" ;;
            *) echo "auth token: a value is configured, which npm will prefer over OIDC" ;;
          esac

      - if: steps.published.outputs.skip != 'true'
        run: npm publish

      - name: confirm the registry has it
        if: steps.published.outputs.skip != 'true'
        run: |
          name=$(node -p "require('./package.json').name")
          pkg=$(node -p "require('./package.json').version")
          for i in $(seq 1 60); do
            got=$(npm view "$name@$pkg" version --prefer-online 2>/dev/null || true)
            [ "$got" = "$pkg" ] && { echo "published: $name@$got"; exit 0; }
            sleep 10
          done
          echo "::error::$name@$pkg not visible on the registry 10 minutes after publishing"
          exit 1
